<!DOCTYPE html>
<html>
<body>

<h2>A Nested List</h2>
<p>Lists can be nested (list inside list):</p>

<ul>
  <li>List item one</li>
  <ul>
    <li>Nested list item one</li>
    <li>Nested list item two</li>
  </ul>
  <li>List item two</li>
  <li>List item 'n'</li>
</ul>
===============
<ul>
  <li>List item one</li>
    <ul>
      <li>Nested list item one</li>
      <li>Nested list item two</li>
    </ul>
  <li>List item two</li>
  <li>List item 'n'</li>
</ul>

</body>
</html>
